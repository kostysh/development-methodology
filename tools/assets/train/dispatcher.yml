name: Methodology train
on:
  schedule:
    - cron: '0 0,2,4 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Optional urgent PR number
        type: string
      docs:
        description: Verify the selected documentation-only PR
        type: boolean
        default: false
permissions: {}
jobs:
  dispatch:
    if: github.ref_name == github.event.repository.default_branch
    environment: methodology-train
    runs-on:
      group: methodology-train
      labels: train-linux
    timeout-minutes: 180
    env:
      TRAIN_INSTALLATION_ID: ${{ vars.TRAIN_INSTALLATION_ID }}
      TRAIN_APP_KEY_FILE: /etc/methodology/train-app.pem
    steps:
      - name: Start scheduled train
        if: github.event_name == 'schedule'
        run: /opt/methodology/bin/methodology-train run /etc/methodology/train.json --scheduled
      - name: Start on demand
        if: github.event_name == 'workflow_dispatch' && !inputs.pr && !inputs.docs
        run: /opt/methodology/bin/methodology-train run /etc/methodology/train.json
      - name: Start urgent train
        if: github.event_name == 'workflow_dispatch' && inputs.pr && !inputs.docs
        env:
          PR: ${{ inputs.pr }}
        run: /opt/methodology/bin/methodology-train run /etc/methodology/train.json --pr "$PR"
      - name: Start documentation train
        if: github.event_name == 'workflow_dispatch' && inputs.docs
        env:
          PR: ${{ inputs.pr }}
        run: /opt/methodology/bin/methodology-train run /etc/methodology/train.json --pr "$PR" --docs
