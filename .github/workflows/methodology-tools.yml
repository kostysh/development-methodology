name: Methodology tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the independently approved mandatory test inventory
        env:
          APPROVED_SHA256: ${{ vars.METHODOLOGY_V5_3_0_INVENTORY_SHA256 }}
        run: |
          printf '%s  test/required-cases.json\n' "$APPROVED_SHA256" | sha256sum --strict --check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Resolve the archive version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p 'require("./package.json").version')
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'tools/package.json must have a numeric major.minor.patch version.' >&2
            exit 1
          fi
          version="$package_version"
          is_release=false
          if [[ "$GITHUB_REF" == refs/tags/methodology-v* ]]; then
            version="${GITHUB_REF#refs/tags/methodology-v}"
            if [[ "$version" != "$package_version" ]]; then
              printf 'Release tag must be methodology-v%s to match tools/package.json.\n' "$package_version" >&2
              exit 1
            fi
            is_release=true
          fi
          printf 'version=%s\nis_release=%s\n' "$version" "$is_release" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:packed
        env:
          METHODOLOGY_APPROVED_INVENTORY_SHA256: ${{ vars.METHODOLOGY_V5_3_0_INVENTORY_SHA256 }}
          METHODOLOGY_RELEASE_DIR: ${{ runner.temp }}/methodology-release
      - run: npm run check:links -- ..
      - name: Verify the portable guide and record its source
        working-directory: .
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/methodology-release"
          guide="methodology-guide-$RELEASE_VERSION.tar.gz"
          tools_archive="kostysh-development-methodology-tools-$RELEASE_VERSION.tgz"
          git archive --format=tar.gz --output="$release/$guide" "$GITHUB_SHA" -- README.md ADOPTION.md CHANGELOG.md GLOSSARY.md PROJECT-PROFILE.md WORKFLOW.md method defaults templates
          mkdir "$RUNNER_TEMP/adopted-guide"
          tar -xzf "$release/$guide" -C "$RUNNER_TEMP/adopted-guide"
          test ! -e "$RUNNER_TEMP/adopted-guide/AGENTS.md"
          node tools/dist/check-links.js "$RUNNER_TEMP/adopted-guide"
          cd "$release"
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum --check "$tools_archive.sha256"
          sha256sum "$guide" "$tools_archive" source-commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: methodology-v5-${{ github.sha }}
          path: ${{ runner.temp }}/methodology-release/
          if-no-files-found: error

  release-provenance:
    if: needs.verify.outputs.is_release == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: methodology-v5-${{ github.sha }}
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS
